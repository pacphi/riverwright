# Keeps CI actions and any future npm dependencies current.
# Riverwright itself has no runtime dependencies (Node built-ins only); the npm entry keeps
# the development tools (the Markdown linter) current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dependencies:
        patterns: ["*"]
